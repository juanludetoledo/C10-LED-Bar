name: C10 LED Control

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  # Comprueba que el codigo compila (APK de prueba sin firmar; no se publica)
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: gradle assembleDebug --no-daemon

  # Publica en Releases la APK oficial firmada (carpeta dist/) y el instalador.
  # La version sale de .github/version (por ejemplo v18): al cambiarla se crea una version nueva.
  publicar:
    if: github.ref == 'refs/heads/main'
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer version
        id: v
        run: echo "tag=$(tr -d '[:space:]' < .github/version)" >> "$GITHUB_OUTPUT"
      - name: Rehacer la version (solo si existe .github/rehacer-version)
        if: hashFiles('.github/rehacer-version') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.v.outputs.tag }}" --cleanup-tag -y --repo "${{ github.repository }}" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: C10 LED Control ${{ steps.v.outputs.tag }}
          make_latest: true
          body_path: .github/release-notes.md
          files: |
            dist/*.apk
            installer/LEDBAR_C10_JUANLU_Install.exe
