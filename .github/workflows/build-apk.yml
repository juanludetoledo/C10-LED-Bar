name: C10 LED Control

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  # Comprueba que el codigo compila (APK de prueba sin firmar; no se publica)
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: gradle assembleDebug --no-daemon

  # Al crear una etiqueta v... publica en Releases la APK oficial firmada (carpeta dist/) y el instalador
  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          name: C10 LED Control ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            dist/*.apk
            installer/LEDBAR_C10_JUANLU_Install.exe
